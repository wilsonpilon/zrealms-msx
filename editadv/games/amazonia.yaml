    texto: "z Os comandos mais comuns são: EXAMINE LOCAL - lista os objetos que estão no local. HORAS - informa as horas. TEMOS - lista os objetos que estão com o jogador. GRAVE - salva a partida. RECUPERE - recupera uma partida. RECOMECE - reinicia a partida."
