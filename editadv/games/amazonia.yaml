    texto: "z Após uma referência a um objeto, este pode ser substituido pelo pronome correspondente. Por exemplo: PEGUE A CORDA EXAMINE-A COLOQUE-A NA MALA Os objetos que naturalmente pertencem a um lugar não são listados pelo comando EXAMINE O LOCAL. Para saber se um determinado objeto se encontra na posição do jogador use o comando PROCURE objeto."
