  - id: 186
    texto: "zAMAZÔNIA: O destino o colocou frente a uma situação delicada: sobrevivência. Provavelmente você nunca esteve numa selva real e agora precisa escapar de uma totalmente desconhecida. Para que você tenha sucesso vou dar-lhe alguns conselhos. Andar numa selva é extremamente perigoso. Você pode encontrar animais perigosos, tais como cobras e onças. Esses animais costumam atacar os homens quando se sentem ameaçados"
  - id: 187
    texto: "zou quando estão famintos. Mas isto não significa que eles não possam atacar sem um motivo aparente. A onça, por exemplo, é um animal muito forte e determinado. Sua pele amarelo ouro, com grandes manchas pretas, torna este animal difícil de ser localizado numa vegetação densa. De fato, o habitat natural da onça é a mata fechada, onde ela se move com desenvoltura e sem provocar o menor ruido. Seus dentes e garras afiados tornam o seu poder destruidor algo assustador."
  - id: 188
    texto: "z Esses animais não se intimidam facilmente e em alguns casos não há alternativa a não ser enfrentá-los. Nesses casos um dos dois provavelmente terminará morto. Tenha todo o cuidado para não ser você. As cobras, por outro lado, habitam lugares úmidos, notadamente margens de lagos e riachos,lugares cheios de pedras - morros e serras, e lugares cuja vegetação é muito cerrada - um bambuzal, por exemplo. Elas são tão perigosas quanto as onças, porém é mais fácil lidar com elas. Apesar disto, uma picada de"
  - id: 189
    texto: "zcobra é morte certa se você não for medicado a tempo. Além dos animais, a selva possui também outros habitantes, como é o caso dos índios. Normalmente eles são dóceis e gentis, porém nunca provoque um índio pois eles podem se tornar perigosos. Diversos orgãos do governo brasileiro tem documentos que mencionam a existência de tribos canibais em plena selva amazônica. Tais informaçÕes nunca foram devidamente comprovadas, porém existem"
  - id: 190
    texto: "zlendas, contadas pelos índios,de que há um povo muito estranho que habita a selva. Tudo isto pode não passar de lenda porém é melhor não arriscar muito. Outras lendas, relativas à selva, dizem que muito antes do descobrimento do Brasil existiam povos desenvolvidos no interior do país. Diversas incursÕes na Amazônia já foram realizadas afim de se descobrir vestígios dessas civilizaçÕes. É interessante notar que a lenda do Eldorado situa a cidade de ouro"
  - id: 191
    texto: "zno coração da selva. E não é só isso pois há também a lenda do mundo subterrâneo que teria uma das suas entradas justamente na Amazônia. O próprio exército brasileiro já promoveu expediçÕes exploratórias e nada constatou. Dizem até que um dos acampamentos foi abandonado às pressas e que até hoje ninguém retornou desta expedição. Enfim, na selva a sua preocupação principal deverá ser sempre sobreviver e retornar à civilização. Para tanto você deverá contar com suas"
  - id: 192
    texto: "zhabilidades, perspicácia, bom senso e inteligência. Lembre-se que estará sempre sozinho e que um passo em falso pode significar a morte. O JOGO: O AMAZÔNIA possui um sistema de reconhecimento de frases que dispensa a digitação das palavras por inteiro. Por exemplo: EX, EXA e EXAM correspondem à palavra EXAMINE. Tal sistema funciona a partir de um buffer onde as palavras estão"
  - id: 193
    texto: "zarquivadas de acordo com a sua importância no jogo, ou seja, o sistema utilizará a primeira palavra que satisfaça o que foi digitado pelo jogador. Quanto mais letras forem fornecidas, mais acertadamente o sistema se manifestará. A acentuação ortográfica deverá ser respeitada, caso contrário a palavra não será reconhecida. Acentue de acordo com as regras de acentuação do seu computador e caso não obtenha o resultado esperado, utilize os caracteres alternativos"
  - id: 194
    texto: "zabaixo: shift 1 - ä shift 6 - Ã shift 2 - É shift 7 - õ shift 3 - ë shift 8 - Â shift 4 - Ó shift 9 - ê shift 5 - Ú shift 0 - Ô Na selva o jogador se movimentará por trilhas que podem mudar de direção abruptamente. Desta forma, quando o jogador chegar numa posição vindo pelo NORTE, por exemplo, o retorno nem sempre se dará pelo SUL."
